# Lakeflow Job: daily NESO ingest -> Bronze -> Silver -> dbt (staging + Gold + tests) -> freshness check.
# No cluster is defined, so every task runs on serverless compute.

resources:
  jobs:
    gridpulse_daily:
      name: gridpulse-daily
      description: Daily GB carbon-intensity lakehouse refresh (NESO API -> Bronze/Silver/Gold).

      schedule:
        # 06:30 UK time every day; Europe/London handles BST automatically.
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: Europe/London
        pause_status: UNPAUSED

      max_concurrent_runs: 1   # two overlapping runs could race on the same MERGE
      timeout_seconds: 3600
      queue:
        enabled: true

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      parameters:
        - name: lookback_days
          default: ${var.lookback_days}

      tags:
        project: gridpulse
        layer: medallion

      tasks:
        - task_key: ingest_raw
          notebook_task:
            notebook_path: ../pipelines/01_ingest_raw.py
          max_retries: 2
          min_retry_interval_millis: 300000   # API hiccups: retry after 5 minutes
          retry_on_timeout: true
          timeout_seconds: 900

        - task_key: load_bronze
          depends_on:
            - task_key: ingest_raw
          notebook_task:
            notebook_path: ../pipelines/02_load_bronze_autoloader.py
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: build_silver
          depends_on:
            - task_key: load_bronze
          notebook_task:
            notebook_path: ../notebooks/03_silver_transform.ipynb

        # Silver -> Gold is now modelled in dbt (replaces the old 04_gold.py notebook task).
        # `dbt build` runs every model AND its tests in dependency order; a failed test stops the run.
        # No profiles_directory is set, so Databricks generates the dbt connection profile from
        # the SQL warehouse, catalog and schema below (no token stored anywhere).
        - task_key: dbt_build
          depends_on:
            - task_key: build_silver
          dbt_task:
            project_directory: ../dbt
            commands:
              - "dbt build"
            warehouse_id: ${var.warehouse_id}
            catalog: gridpulse
            schema: gold
          environment_key: dbt_env

        - task_key: freshness_check
          depends_on:
            - task_key: dbt_build
          notebook_task:
            notebook_path: ../pipelines/05_freshness_check.py

      # Serverless environment for the dbt task: installs the dbt Databricks adapter.
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "4"
            dependencies:
              - dbt-databricks>=1.8.0,<2.0.0
